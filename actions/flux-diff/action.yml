---
name: Flux Diff
description: Render a Flux manifest tree at a PR and at its base branch with flate, and diff the two
author: homelab-ops@homelab-ops.com

inputs:
  flate_version:
    required: false
    description: flate release installed through setup-repository-tools (mise aqua backend)
    # renovate: datasource=github-releases depName=home-operations/flate
    default: "v0.6.5"
  krmignore:
    required: false
    description: gitignore-style file, relative to the repository root, of paths to leave out of both trees
    default: ""
  log_level:
    required: false
    default: info
  other_params:
    required: false
    default: ""
  path_after:
    required: true
    description: manifest tree in the PR checkout, relative to the repository root
  path_before:
    required: true
    description: manifest tree in the base-branch checkout, relative to the repository root
  resource_type:
    required: true
  token:
    required: true
    description: token for the checkouts and for mise's GitHub API calls

outputs:
  diff:
    value: ${{ steps.diff.outputs.diff }}

runs:
  using: composite
  steps:
  # Checks out github.ref into current/ (a pull_request's merge commit) and installs flate.
  - name: Setup repository and tools
    uses: ppat/homelab-ops-actions/actions/setup-repository-tools@b243512e70e84044d607787b1f482881906b0f01 # v3.0.0
    with:
      current_git_ref: ${{ github.ref }}
      current_repository: ${{ github.repository }}
      token: ${{ inputs.token }}
      mise_toml: |
        [tools]
        "aqua:home-operations/flate" = "${{ inputs.flate_version }}"

  - name: Checkout base branch
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    with:
      path: base
      persist-credentials: false
      ref: ${{ github.base_ref || github.event.repository.default_branch }}
      token: ${{ inputs.token }}

  - name: Run flate diff
    shell: bash
    env:
      KRMIGNORE: ${{ inputs.krmignore }}
      LOG_LEVEL: ${{ inputs.log_level }}
      OTHER_PARAMS: ${{ inputs.other_params }}
      PATH_AFTER: ${{ inputs.path_after }}
      PATH_BEFORE: ${{ inputs.path_before }}
      RESOURCE_TYPE: ${{ inputs.resource_type }}
    # yamllint disable-line rule:indentation
    run: |
      set -euo pipefail
      # A tree added or removed by the PR exists on one side only. flate rejects a missing
      # path but renders an empty one as a full addition or removal.
      mkdir -p "current/${PATH_AFTER}" "base/${PATH_BEFORE}"
      read -ra other_params <<< "${OTHER_PARAMS}"
      if [[ -n "${KRMIGNORE}" ]]; then
        other_params+=(--krmignore "current/${KRMIGNORE}")
      fi
      flate --version
      flate diff "${RESOURCE_TYPE}" \
        --path "current/${PATH_AFTER}" \
        --path-orig "base/${PATH_BEFORE}" \
        --output diff \
        --log-level "${LOG_LEVEL,,}" \
        --no-progress \
        --concurrency 1 \
        "${other_params[@]}" \
        > diff.patch

  - name: Generate Diff
    id: diff
    shell: bash
    # yamllint disable-line rule:indentation
    run: |
      echo 'diff<<EOF' >> $GITHUB_OUTPUT
      cat diff.patch >> $GITHUB_OUTPUT
      echo 'EOF' >> $GITHUB_OUTPUT
      echo
      if [ -s diff.patch ]; then
        echo "Changes detected:"
        cat diff.patch | sed -E 's|^|    |p'
      else
        echo "No changes detected."
      fi
