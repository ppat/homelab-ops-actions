---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo-release
  namespace: monitoring
spec:
  chartRef:
    kind: OCIRepository
    name: podinfo-repository
    namespace: flux-system
  releaseName: podinfo
  targetNamespace: monitoring

  values:
    # Substituted so the before and after trees render this release differently.
    # flux-local only templates a HelmRelease whose inputs changed, so without a
    # difference here the chart is never rendered and the digest path is never
    # exercised -- the test would pass without testing anything.
    ui:
      message: ${podinfo_message}
    ingress:
      enabled: true
      hosts:
      - host: podinfo.${domain_name}
        paths:
        - path: /
          pathType: Prefix
